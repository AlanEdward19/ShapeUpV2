# Apple Silicon override. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.mac.yml up -d
#
# Requirements:
#   Docker Desktop → Settings → General → "Use Rosetta for x86/amd64 emulation"
#   At least 4 GB RAM for the Docker VM (SQL Server needs ~2 GB by itself).

services:
  sqlserver:
    platform: linux/amd64
    mem_limit: 2g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"

  # Docker Desktop's Linux VM on current macOS ships kernel 6.19+/7.x.
  # mongo:8 refuses to boot on that kernel unless glibc rseq is forced on.
  mongo:
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1

  mongo-init:
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
