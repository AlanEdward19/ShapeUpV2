version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shapeup-api
    depends_on:
      sqlserver:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=ShapeUpDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;Encrypt=false;
      Mongo__Training__ConnectionString: mongodb://mongo:27017/?replicaSet=rs0
      Mongo__Training__DatabaseName: shapeup
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      Firebase__ProjectId: your-firebase-project-id
      Observability__OtlpEndpoint: http://seq:80

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-dev
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  mongo:
    image: mongo:8
    container_name: shapeup-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-init:
    image: mongo:8
    container_name: shapeup-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./docker/mongo-init-replica-set.js:/scripts/mongo-init-replica-set.js:ro
    entrypoint:
      - bash
      - -c
      - mongosh --host mongo:27017 /scripts/mongo-init-replica-set.js

  # Local, self-hosted message broker (ROADMAP event-bus). Management UI at http://localhost:15672.
  # Local dev only -- never expose these ports publicly like this (same caution as Seq above).
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shapeup-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Observability (ROADMAP.md Fase 1 -- Observabilidade day one).
  # Local, self-hosted OTLP sink: receives traces/metrics/logs from the API via
  # OpenTelemetry and lets you inspect them at http://localhost:8081. No SaaS account
  # needed. Swap the OTLP endpoint in appsettings.json to point at a real collector later.
  seq:
    image: datalust/seq:latest
    container_name: shapeup-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true" # local dev only -- never expose this port publicly like this
    ports:
      - "8081:80"
    volumes:
      - seq_data:/data

volumes:
  sqlserver_data:
  mongo_data:
  rabbitmq_data:
  seq_data:

